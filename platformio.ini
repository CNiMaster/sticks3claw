; PlatformIO Configuration for Sticks3 ESP32-S3 Project
; 目标开发板: ESP32-S3-Pico-1-N8R8

[env:esp32-s3-pico]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 串口配置
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; 分区方案 - 使用大应用分区方案
board_build.partitions = default_8MB.csv

; PSRAM 配置 (OPI PSRAM 8MB)
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 8MB

; 编译优化选项
; 注：旧版 build_optimization 已被 PlatformIO 废弃，改用 build_type + 编译器参数
build_unflags = -Os
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DUSE_HSPI_PORT
    -mfix-esp32-psram-cache-issue
    -mfix-esp32-psram-cache-strategy=memw
    -I .
    -DUSER_SETUP_LOADED=1
    -include User_Setup.h

; 库依赖
lib_deps =
    ; JSON 处理
    bblanchon/ArduinoJson@^7.0.4

    ; TFT 显示驱动
    bodmer/TFT_eSPI@^2.5.43

    ; WebSocket (火山引擎 STT + Edge TTS)
    links2004/WebSockets

    ; Web 服务器（配网 + 设置）
    mathieucarbou/ESPAsyncWebServer @ ^3.1.5

; 开发环境配置
debug_tool = esp-prog
debug_init_break = tbreak setup
upload_speed = 921600

; 自动上传的文件系统映像
board_build.filesystem = littlefs
